# =====================================================================
# Stone Discord Nachrichten (Deutsch)
#
# Unterstützte Farbformate, gleichzeitig nutzbar in jeder Nachricht:
#   &-Codes        z.B. &a, &b, &l
#   Hex-Farben     z.B. &#FF00AA
#   MiniMessage    z.B. <gradient:#ff0000:#0000ff>text</gradient>
#
# Hinweis: Die eigentliche /discord-Nachricht steht NICHT hier, sondern
# in der config.yml (discord.message) - sie bleibt dadurch unabhängig
# von der unten gewählten Sprache immer gleich.
# =====================================================================

prefix: "&l&8[&7Stone &9&lDiscord&8]&r "

general:
  no-permission: "&c✖ Du hast keine Berechtigung dafür."
  reload-triggered: "&e⟳ &7Konfiguration und Nachrichten werden neu geladen..."
  reload-success: "&a✔ Konfiguration und Nachrichten wurden neu geladen."

help:
  header: "<gradient:#9AA5B1:#5865F2><bold>▬▬▬▬▬ Stone Discord Hilfe ▬▬▬▬▬</bold></gradient>"
  reload: "&e/stonediscord reload &8» &7Konfiguration und Nachrichten neu laden"
  checkupdate: "&e/stonediscord checkupdate &8» &7Jetzt sofort auf Modrinth nach einer neuen Version suchen"
  help: "&e/stonediscord help &8» &7Dieses Hilfemenü anzeigen"

discord:
  disabled: "&c✖ Der Discord-Befehl ist derzeit deaktiviert."
  cooldown: "&c✖ Bitte warte noch {seconds} Sekunde(n), bevor du das erneut nutzt."

update:
  # {version} {current} {behind}
  available: "&l&8[&7Stone &9&lDiscord&8]&r &fEine neue Version ist verfügbar: &a{version} &7(du nutzt &c{current}&7, &e{behind} &7dahinter). Auf Modrinth aktualisieren."
  versions-behind: "{count} Version(en)"
  versions-behind-unknown: "einer unbekannten Anzahl an Versionen"
  check-triggered: "&e⟳ &7Suche jetzt auf Modrinth nach Updates... &8Ergebnis erscheint in der Konsole."
