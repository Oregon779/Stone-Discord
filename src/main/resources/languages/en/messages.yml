# =====================================================================
# Stone Discord messages (English)
#
# Supported color formats, usable at the same time in any message:
#   &-codes        e.g. &a, &b, &l
#   Hex colors     e.g. &#FF00AA
#   MiniMessage    e.g. <gradient:#ff0000:#0000ff>text</gradient>
#
# Note: the /discord invite message itself is NOT here - it lives in
# config.yml (discord.message) since it stays the same regardless of
# the language chosen below.
# =====================================================================

prefix: "&l&8[&7Stone &9&lDiscord&8]&r "

general:
  no-permission: "&c✖ &7You don't have permission to do this."
  reload-triggered: "&e⟳ &7Reloading configuration and messages..."
  reload-success: "&a✔ &7Configuration and messages have been reloaded."
  reload-in-progress: "&c✖ &7A reload is already in progress, please wait for it to finish."
  player-only: "&c✖ &7This command can only be used by a player."

help:
  header: "<gradient:#9AA5B1:#5865F2><bold>▬▬▬▬▬ Stone Discord Help ▬▬▬▬▬</bold></gradient>"
  reload: "&e/stonediscord reload &8» &7Reload the configuration and messages"
  checkupdate: "&e/stonediscord checkupdate &8» &7Check Modrinth for a new version right now"
  help: "&e/stonediscord help &8» &7Show this help menu"

discord:
  disabled: "&c✖ &7The Discord command is currently disabled."
  cooldown: "&c✖ &7Please wait &f{seconds} &7more second(s) before using this again."

# {link} - the link of the GUI item that was clicked (see config.yml discord/media/social)
media:
  disabled: "&c✖ &7The media application menu is currently disabled."
  link-sent: "&a✔ &7Here's your link: <hover:show_text:'Click to open'><click:open_url:'{link}'><#5865F2><u>{link}</u></#5865F2></click></hover>"

social:
  disabled: "&c✖ &7The social media menu is currently disabled."
  link-sent: "&a✔ &7Here's your link: <hover:show_text:'Click to open'><click:open_url:'{link}'><#5865F2><u>{link}</u></#5865F2></click></hover>"

update:
  # {version} {current} {behind}
  available: "&l&8[&7Stone &9&lDiscord&8]&r &fA new version is available: &a{version} &7(you're on &c{current}&7, &e{behind} &7behind). Check Modrinth to update."
  versions-behind: "{count} version(s)"
  versions-behind-unknown: "an unknown number of versions"
  check-triggered: "&e⟳ &7Checking Modrinth for updates now... &8watch the console for the result."
